<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ثبت مرسولات</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#183047;font-family:Tahoma,Arial,sans-serif}header{background:#0c477b;color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;opacity:.85}.wrap{max-width:650px;margin:auto;padding:14px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.action{border:0;border-radius:15px;padding:15px;background:#fff;box-shadow:0 3px 12px #173b5915;color:#183047;font-size:14px;font-weight:bold}.action.primary{background:#0b7cba;color:#fff}.action span{display:block;font-size:11px;font-weight:normal;margin-top:6px;opacity:.8}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 12px #173b5915;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{font-size:12px;color:#718096}.parcel{border:1px solid #e1e8ef;border-radius:13px;padding:12px;margin-top:10px}.code{font-size:17px;font-weight:bold;direction:ltr;text-align:left;word-break:break-all}.smallbtn{border:0;border-radius:9px;padding:7px 10px;background:#edf3f8;color:#24506e}.danger{background:#fff0f0;color:#b42318}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:650px;background:#fff;border-radius:24px 24px 0 0;padding:15px;max-height:94vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:#edf2f7;border-radius:50%;width:34px;height:34px;font-size:22px}.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;min-height:300px}.scanbox video{display:block;width:100%;height:360px;object-fit:cover;background:#000}.guide{position:absolute;inset:25% 10%;border:2px solid #22d39a;border-radius:12px;box-shadow:0 0 0 999px #0002;pointer-events:none}.status{font-size:13px;line-height:1.8;margin:10px 0;color:#40546b}.detected{display:none;background:#e8fff4;border:1px solid #8de0bb;color:#087443;padding:11px;border-radius:12px;word-break:break-all;direction:ltr;text-align:left}.detected.show{display:block}.buttons{display:flex;gap:8px}.mainbtn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:bold}.blue{background:#0b7cba;color:#fff}.gray{background:#edf2f7;color:#183047}input{width:100%;padding:12px;border:1px solid #dbe4ec;border-radius:10px;font-size:15px;margin:10px 0}
</style></head>
<body>
<header><div class="wrap"><h1>ثبت و تحویل مرسولات</h1><div class="sub">اسکن زنده و ذخیره خودکار بارکد</div></div></header>
<main class="wrap">
<section class="actions">
<button class="action primary" id="scanBtn">⌗ اسکن زنده QR / بارکد<span>تشخیص و ذخیره خودکار</span></button>
<button class="action" id="addBtn">＋ ثبت دستی بارکد<span>افزودن کد به فهرست</span></button>
</section>
<section class="card"><div class="row"><strong>فهرست بارکدها</strong><span class="muted" id="count">۰ مورد</span></div><div id="list"></div></section>
</main>
<div class="modal" id="scanModal"><div class="sheet"><div class="sheethead"><strong>اسکن زنده QR و بارکد</strong><button class="close" id="closeScan">×</button></div><div class="scanbox"><video id="video" autoplay muted playsinline></video><div class="guide"></div></div><div class="status" id="status">در حال آماده‌سازی دوربین...</div><div class="detected" id="detected"></div><div class="buttons"><button class="mainbtn gray" id="stopBtn">بستن دوربین</button><button class="mainbtn blue" id="againBtn">اسکن دوباره</button></div></div></div>
<div class="modal" id="manualModal"><div class="sheet"><div class="sheethead"><strong>ثبت دستی بارکد</strong><button class="close" id="closeManual">×</button></div><input id="manualInput" inputmode="numeric" placeholder="کد بارکد را وارد کنید"><button class="mainbtn blue" id="saveManual">ذخیره کد</button></div></div>
<script>
const $=s=>document.querySelector(s);let parcels=JSON.parse(localStorage.getItem('parcels_v2')||'[]');let stream=null,reader=null,active=false,lastCode='';
function save(){localStorage.setItem('parcels_v2',JSON.stringify(parcels));render()}
function render(){ $('#count').textContent=parcels.length+' مورد';$('#list').innerHTML=parcels.length?parcels.map((p,i)=>`<div class="parcel"><div class="row"><div class="code">${escapeHtml(p.code)}</div><button class="smallbtn danger" data-del="${i}">حذف</button></div><div class="muted">ثبت‌شده: ${new Date(p.date).toLocaleString('fa-IR')}</div></div>`).join(''):'<div class="muted" style="margin-top:15px">هنوز بارکدی ثبت نشده است.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{parcels.splice(+b.dataset.del,1);save()})}
function escapeHtml(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function addCode(raw){let code=String(raw||'').trim();if(!code)return false;$('#detected').textContent=code;$('#detected').classList.add('show');if(!parcels.some(p=>p.code===code)){parcels.unshift({code,date:Date.now()});save();$('#status').textContent='کد تشخیص داده شد و در فهرست ذخیره شد.'}else $('#status').textContent='این کد قبلاً ثبت شده است.';setTimeout(()=>stopScan(true),900);return true}
async function startScan(){stopScan(false);$('#scanModal').classList.add('open');$('#detected').classList.remove('show');$('#status').textContent='در حال بازکردن دوربین...';lastCode='';active=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('no-camera');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const v=$('#video');v.srcObject=stream;await v.play();$('#status').textContent='دوربین فعال است؛ بارکد را داخل کادر قرار دهید.';if('BarcodeDetector' in window){let formats;try{formats=await BarcodeDetector.getSupportedFormats()}catch(e){}const detector=new BarcodeDetector(formats?.length?{formats}:undefined);scanNative(detector)}else scanZXing()}catch(e){active=false;$('#status').textContent='دوربین باز نشد. مجوز دوربین را فعال کنید و سایت را با HTTPS باز کنید.'}}
async function scanNative(detector){if(!active)return;try{const results=await detector.detect($('#video'));if(results?.length){const val=results[0].rawValue;if(val&&val!==lastCode){lastCode=val;addCode(val);return}}}catch(e){}requestAnimationFrame(()=>scanNative(detector))}
function scanZXing(){if(!window.ZXingBrowser){$('#status').textContent='کتابخانه اسکن بارگذاری نشده است؛ اینترنت را بررسی کنید.';return}try{reader=new ZXingBrowser.BrowserMultiFormatReader();reader.decodeFromVideoElement($('#video'),(result,err)=>{if(!active||!result)return;const val=result.getText?.()||result.text;if(val&&val!==lastCode){lastCode=val;addCode(val)}})}catch(e){$('#status').textContent='تشخیص بارکد در این مرورگر پشتیبانی نشد.'}}
function stopScan(close=true){active=false;try{reader?.reset()}catch(e){}reader=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=$('#video');if(v)v.srcObject=null;if(close)$('#scanModal').classList.remove('open')}
$('#scanBtn').onclick=startScan;$('#stopBtn').onclick=()=>stopScan(true);$('#closeScan').onclick=()=>stopScan(true);$('#againBtn').onclick=startScan;$('#addBtn').onclick=()=>{$('#manualModal').classList.add('open');$('#manualInput').focus()};$('#closeManual').onclick=()=>$('#manualModal').classList.remove('open');$('#saveManual').onclick=()=>{if(addCode($('#manualInput').value)){ $('#manualInput').value='';$('#manualModal').classList.remove('open')}};render();
</script></body></html>
